<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveAvatar Widget</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      z-index: 2;
    }
    #startBtn {
      padding: 12px 18px;
      font-size: 16px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="overlay"><button id="startBtn">Start</button></div>
    <audio id="audio" autoplay></audio>
    <video id="video" autoplay playsinline></video>
  </div>
  <input type="hidden" id="sessionid" value="0" />

  <script src="client.js?v=20260206-widget2"></script>
  <script>
  (function () {
    var params = new URLSearchParams(window.location.search || "");
    var quality = params.get("quality") || "auto";
    var profile = params.get("profile") || "head";
    var playoutMode = params.get("playout") || "auto";
    var playoutDelay = parseFloat(params.get("playoutDelay") || "0.25");
    var autostart = params.get("autostart") === "1";
    var allowedOrigin = params.get("origin") || "";

    window.getQualityPreference = function () { return quality; };
    window.getProfilePreference = function () { return profile; };
    window.getPlayoutDelayMode = function () { return playoutMode; };
    window.getPlayoutDelaySeconds = function () {
      return isNaN(playoutDelay) ? 0.25 : playoutDelay;
    };

    function sendText(text) {
      var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
      if (!sid || !text) return;
      fetch('/human', {
        body: JSON.stringify({
          text: String(text),
          type: 'echo',
          interrupt: true,
          sessionid: sid
        }),
        headers: { 'Content-Type': 'application/json' },
        method: 'POST'
      }).catch(function () {});
    }

    function setQuality(q) {
      var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
      if (!sid || !q) return;
      fetch('/webrtc_quality', {
        body: JSON.stringify({ sessionid: sid, quality: String(q) }),
        headers: { 'Content-Type': 'application/json' },
        method: 'POST'
      }).catch(function () {});
    }

    function startWidget() {
      var overlay = document.getElementById('overlay');
      overlay.style.display = 'none';
      var video = document.getElementById('video');
      var audio = document.getElementById('audio');
      video.muted = false;
      if (audio) audio.muted = false;
      try { start(); } catch (e) {}
    }

    document.getElementById('startBtn').addEventListener('click', startWidget);

    if (autostart) {
      var video = document.getElementById('video');
      var audio = document.getElementById('audio');
      video.muted = true;
      if (audio) audio.muted = true;
      try { start(); } catch (e) {}
    }

    window.onSessionReady = function (sid) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'liveavatar:ready', sessionid: sid }, '*');
      }
      if (autostart) {
        var overlay = document.getElementById('overlay');
        overlay.style.display = 'none';
      }
    };

    window.onWebRTCStats = function (summary) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'liveavatar:stats', summary: summary }, '*');
      }
    };

    window.addEventListener('message', function (event) {
      if (allowedOrigin && event.origin !== allowedOrigin) return;
      var msg = event.data || {};
      if (msg.type === 'liveavatar:send') sendText(msg.text || "");
      if (msg.type === 'liveavatar:start') startWidget();
      if (msg.type === 'liveavatar:stop') { try { stop(); } catch (e) {} }
      if (msg.type === 'liveavatar:quality') setQuality(msg.quality || "");
    });
  })();
  </script>
</body>
</html>
