<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC Chat (Lite)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    button { padding: 8px 16px; margin-right: 6px; }
    textarea { width: 600px; height: 60px; }
    #media { max-width: 1280px; margin-top: 12px; }
    #video { width: 600px; background: #000; }
    .option { margin-bottom: 8px; }
    .row { margin-bottom: 10px; }
    #reply { margin-top: 8px; color: #444; white-space: pre-wrap; }
    #rec-status { margin-left: 8px; color: #666; }
  </style>
</head>
<body>

<div class="option">
  <input id="use-stun" type="checkbox"/>
  <label for="use-stun">Использовать STUN-сервер</label>
</div>

<div class="row">
  <button id="start">Подключиться</button>
  <button id="stop" style="display:none">Отключить</button>
</div>

<input type="hidden" id="sessionid" value="0">

<form id="echo-form" action="javascript:void(0)">
  <div class="row">
    <label for="message">Введите текст</label>
  </div>
  <div class="row">
    <textarea id="message">тест</textarea>
  </div>
  <button type="submit" id="send">Отправить</button>
</form>

<div class="row">
  <button id="rec">Записать</button>
  <button id="rec-stop" style="display:none">Стоп</button>
  <span id="rec-status"></span>
</div>

<div id="reply"></div>

<div id="media">
  <audio id="audio" autoplay></audio>
  <video id="video" autoplay playsinline></video>
</div>

<script>
(function () {
  var pc = null;
  var remoteStream = null;
  var recorder = null;
  var recordedChunks = [];
  var micStream = null;

  function log(msg) {
    var replyEl = document.getElementById("reply");
    if (replyEl) replyEl.textContent = msg;
  }

  function setRecState(active) {
    var recBtn = document.getElementById("rec");
    var stopBtn = document.getElementById("rec-stop");
    var statusEl = document.getElementById("rec-status");
    if (active) {
      if (recBtn) recBtn.style.display = "none";
      if (stopBtn) stopBtn.style.display = "inline-block";
      if (statusEl) statusEl.textContent = "Запись...";
    } else {
      if (recBtn) recBtn.style.display = "inline-block";
      if (stopBtn) stopBtn.style.display = "none";
      if (statusEl) statusEl.textContent = "";
    }
  }

  async function ensureMic() {
    if (micStream) return micStream;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    return micStream;
  }

  async function fetchIceServers() {
    try {
      var res = await fetch("/ice");
      var data = await res.json();
      if (data && Array.isArray(data.iceServers) && data.iceServers.length) {
        return data.iceServers;
      }
    } catch (e) {}
    return [{ urls: ["stun:stun.l.google.com:19302"] }];
  }

  function waitIceComplete(peer) {
    if (peer.iceGatheringState === "complete") return Promise.resolve();
    return new Promise(function (resolve) {
      function check() {
        if (peer.iceGatheringState === "complete") {
          peer.removeEventListener("icegatheringstatechange", check);
          resolve();
        }
      }
      peer.addEventListener("icegatheringstatechange", check);
    });
  }

  async function start() {
    if (pc) return;
    var config = { sdpSemantics: "unified-plan", bundlePolicy: "max-bundle", iceCandidatePoolSize: 2 };
    config.iceServers = await fetchIceServers();

    pc = new RTCPeerConnection(config);
    remoteStream = new MediaStream();
    var videoEl = document.getElementById("video");
    if (videoEl) videoEl.srcObject = remoteStream;
    var audioEl = document.getElementById("audio");
    if (audioEl) audioEl.srcObject = remoteStream;

    pc.addEventListener("track", function (evt) {
      remoteStream.addTrack(evt.track);
    });

    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });

    var offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await waitIceComplete(pc);

    var res = await fetch("/offer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sdp: pc.localDescription.sdp,
        type: pc.localDescription.type,
        quality: "auto",
        profile: "head"
      })
    });

    var text = await res.text();
    if (!res.ok) throw new Error(text || ("HTTP " + res.status));
    var answer = JSON.parse(text);
    document.getElementById("sessionid").value = answer.sessionid || 0;
    await pc.setRemoteDescription(answer);

    document.getElementById("start").style.display = "none";
    document.getElementById("stop").style.display = "inline-block";
    log("Подключено. Можно писать.");
  }

  async function stop() {
    if (!pc) return;
    var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
    if (sid) {
      fetch("/end_session", {
        body: JSON.stringify({ sessionid: sid }),
        headers: { "Content-Type": "application/json" },
        method: "POST"
      }).catch(function () {});
    }
    pc.close();
    pc = null;
    document.getElementById("stop").style.display = "none";
    document.getElementById("start").style.display = "inline-block";
    log("Отключено.");
  }

  function sendMessage(e) {
    if (e && e.preventDefault) e.preventDefault();
    var messageEl = document.getElementById("message");
    var message = (messageEl.value || "").trim();
    if (!message) return;
    var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
    if (!sid) {
      alert("Сначала нажмите Подключиться");
      return;
    }
    fetch("/human", {
      body: JSON.stringify({
        text: message,
        type: "chat",
        interrupt: true,
        sessionid: sid
      }),
      headers: { "Content-Type": "application/json" },
      method: "POST"
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) { throw new Error(t); });
      return res.json();
    }).then(function (data) {
      if (data && data.reply) log("Ответ: " + data.reply);
    }).catch(function (err) {
      log("Ошибка: " + err);
    });
    messageEl.value = "";
  }

  async function startRecording() {
    var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
    if (!sid) {
      alert("Сначала нажмите Подключиться");
      return;
    }
    try {
      await ensureMic();
    } catch (e) {
      log("Нет доступа к микрофону: " + e);
      return;
    }
    recordedChunks = [];
    var options = {};
    if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
      options.mimeType = "audio/webm;codecs=opus";
    } else if (window.MediaRecorder && MediaRecorder.isTypeSupported("audio/webm")) {
      options.mimeType = "audio/webm";
    }
    recorder = new MediaRecorder(micStream, options);
    recorder.ondataavailable = function (evt) {
      if (evt.data && evt.data.size > 0) recordedChunks.push(evt.data);
    };
    recorder.onstop = sendRecording;
    recorder.start();
    setRecState(true);
    log("Запись...");
  }

  function stopRecording() {
    if (recorder && recorder.state === "recording") {
      recorder.stop();
    }
    setRecState(false);
  }

  async function sendRecording() {
    var sid = parseInt(document.getElementById("sessionid").value || "0", 10);
    if (!sid) return;
    if (!recordedChunks.length) {
      log("Нет аудио");
      return;
    }
    var mimeType = (recorder && recorder.mimeType) ? recorder.mimeType : "audio/webm";
    var blob = new Blob(recordedChunks, { type: mimeType });
    var fd = new FormData();
    fd.append("sessionid", sid);
    fd.append("file", blob, "speech.webm");
    try {
      var res = await fetch("/speech", { method: "POST", body: fd });
      var text = await res.text();
      if (!res.ok) throw new Error(text || ("HTTP " + res.status));
      var data = JSON.parse(text);
      if (data && data.text) log("Вы сказали: " + data.text);
      if (data && data.reply) log("Ответ: " + data.reply);
    } catch (err) {
      log("Ошибка: " + err);
    }
  }

  document.getElementById("start").addEventListener("click", function (e) { if (e) e.preventDefault(); start(); });
  document.getElementById("stop").addEventListener("click", function (e) { if (e) e.preventDefault(); stop(); });
  document.getElementById("echo-form").addEventListener("submit", sendMessage);
  document.getElementById("send").addEventListener("click", sendMessage);
  document.getElementById("rec").addEventListener("click", function (e) { if (e) e.preventDefault(); startRecording(); });
  document.getElementById("rec-stop").addEventListener("click", function (e) { if (e) e.preventDefault(); stopRecording(); });
})();
</script>
</body>
</html>
